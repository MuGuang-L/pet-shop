<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>爪爪小铺 · 商家后台</title>
  <link rel="stylesheet" href="/admin/base.css">
  <link rel="stylesheet" href="/admin/app.css">
</head>
<body>
<section id="login">
  <div class="login-story"><span>爪爪小铺</span><h1>商家后台</h1><p>管理商品、处理订单、更新店铺页面。</p><img src="/assets/hero-calm-v3.jpg" alt="猫咪"></div>
  <form class="login-form" onsubmit="login(event)">
    <h2>登录</h2><p class="muted">请使用商家账号</p>
    <label>账号<input id="username" autocomplete="username" required placeholder="商家账号"></label>
    <label>密码<input id="password" type="password" autocomplete="current-password" required placeholder="输入密码"></label>
    <p id="login-error" role="alert"></p><button id="login-button" class="primary full">登录</button>
    <small>模拟经营环境，不产生真实付款与退款。</small>
    <details class="simulation-notes"><summary>模拟使用与数据说明</summary><div id="simulation-login-notes"></div></details>
  </form>
</section>
<div id="workspace" hidden>
  <aside class="admin-sidebar">
    <div class="admin-brand"><span>爪爪小铺<small>商家后台</small></span></div>
    <nav aria-label="商家导航">
      <button data-section="orders" onclick="show('orders')">订单</button>
      <button data-section="products" onclick="show('products')">商品</button>
      <button data-section="store" onclick="show('store')">店铺页面</button>
      <button data-section="settings" onclick="show('settings')">经营设置</button>
    </nav>
    <div class="sidebar-foot">模拟经营<small>付款与退款均为模拟操作</small></div>
  </aside>
  <main class="admin-main">
    <header class="admin-header"><div><h1 id="section-title">订单</h1><p id="section-note"></p></div><div class="operator-controls"><span id="operator"></span><button onclick="showSimulationNotes()">使用说明</button><button onclick="logout()">退出登录</button></div></header>
    <div id="error" role="alert"></div><div id="notice" class="save-notice" role="status" hidden></div>
    <section id="app" aria-busy="false"></section>
  </main>
</div>
<dialog id="modal" aria-label="商家操作详情"></dialog>
<dialog id="discard-dialog" aria-labelledby="discard-title" aria-describedby="discard-description">
  <h2 id="discard-title">放弃未保存的修改？</h2>
  <p id="discard-description">这次编辑的内容尚未保存。继续编辑可以保留当前填写的内容。</p>
  <div class="discard-actions"><button id="discard-cancel" autofocus onclick="resolveDiscard(false)">继续编辑</button><button id="discard-confirm" class="primary" onclick="resolveDiscard(true)">放弃修改</button></div>
</dialog>
<script src="/studio.js"></script><script src="/admin/app.js"></script><script src="/admin/settings.js"></script>
</body>
</html>
