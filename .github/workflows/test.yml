name: Test

on:
  push:
    branches: [main, integration/full-stack]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Start isolated MongoDB
        run: |
          npm run db:start > /tmp/pet-shop-mongo.log 2>&1 &
          for attempt in $(seq 1 60); do
            if node -e 'const {MongoClient}=require("mongodb"); (async()=>{const c=new MongoClient("mongodb://127.0.0.1:27018/?replicaSet=petshop",{serverSelectionTimeoutMS:1000});try{await c.connect();await c.db("admin").command({ping:1});}catch{process.exitCode=1;}finally{await c.close();}})();'; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pet-shop-mongo.log
          exit 1
      - name: Run all tests
        run: npm test
        env:
          PET_MONGO_TEST: '1'
