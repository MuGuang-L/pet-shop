name: Test

on:
  push:
    branches: [main, integration/full-stack]
  pull_request:

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/windows-runtime.test.js
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - name: Start isolated MongoDB
        run: |
          npm run db:start > /tmp/pet-shop-mongo.log 2>&1 &
          for attempt in $(seq 1 60); do
            if node -e 'const {MongoClient}=require("mongodb"); (async()=>{const c=new MongoClient("mongodb://127.0.0.1:27018/?replicaSet=petshop",{serverSelectionTimeoutMS:1000});try{await c.connect();await c.db("admin").command({ping:1});}catch{process.exitCode=1;}finally{await c.close();}})();'; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pet-shop-mongo.log
          exit 1
      - name: Run all tests
        run: npm test
        env:
          PET_MONGO_TEST: '1'
          PET_MYSQL_TEST: '1'
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-test-only-password
